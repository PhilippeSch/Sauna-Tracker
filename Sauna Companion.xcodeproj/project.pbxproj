		66B1DE51E0E258DE8DAE4BD7 /* Set Build Number */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Set Build Number";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Sets the build number on every build to a YYYYMMDDHHMM timestamp. Only\n# Config/Version.xcconfig is written; every target reads\n# CURRENT_PROJECT_VERSION from BUILD_TIMESTAMP, so the iPhone app and the\n# Watch app always carry the same number.\n\n# project.pbxproj is deliberately never written (agvtool used to): changing\n# the project file mid-build makes Xcode reload the project and cancel the\n# run without an error message.\n\n# Skip while archiving — the archive carries the number that was resolved\n# when the run started. Press Cmd-B first if you want a fresh one.\nif [ \"$ACTION\" = \"install\" ]; then\n    echo \"note: archiving, build number stays at $CURRENT_PROJECT_VERSION\"\n    exit 0\nfi\n\nCONFIG=\"${SRCROOT}/Config/Version.xcconfig\"\nTIMESTAMP=$(date \"+%Y%m%d%H%M\")\n\n{\n    echo \"// Von der Build-Phase \\\"Set Build Number\\\" erzeugt. Nicht von Hand aendern.\"\n    echo \"BUILD_TIMESTAMP = $TIMESTAMP\"\n} > \"$CONFIG.new\" || exit 1\n\n# Within the same minute leave the file alone, so Xcode does not have to\n# re-resolve build settings.\nif cmp -s \"$CONFIG.new\" \"$CONFIG\"; then\n    rm -f \"$CONFIG.new\"\n    exit 0\nfi\n\nmv \"$CONFIG.new\" \"$CONFIG\" || exit 1\necho \"note: build number set to $TIMESTAMP (effective from the next build)\"\n";
		};
/* End PBXShellScriptBuildPhase section */

